apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentworkflows-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: agentworkflows-root
    app.kubernetes.io/part-of: agentworkflows
spec:
  project: default
  source:
    repoURL: https://github.com/RamazanKara/agentworkflows.git
    targetRevision: v0.4.0
    path: deploy/clusters/local
    directory:
      include: apps.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
