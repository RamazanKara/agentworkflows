{{- $credentials := dict }}
{{- $secrets := dict }}
{{- if index .Values "inference-gateway" "enabled" }}
{{- $_ := set $secrets .Values.bootstrapAdmin.existingSecret "api-key" }}
{{- end }}
{{- if .Values.workflows.enabled }}
{{- $_ := set $secrets .Values.workflows.postgres.existingSecret "password" }}
{{- $_ := set $secrets .Values.workflows.worker.existingSecret "api-key" }}
{{- end }}
{{- range $name, $key := $secrets }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $value := randAlphaNum 48 | b64enc }}
{{- if $existing }}
{{- $value = required (printf "Secret %s must contain %s" $name $key) (index $existing.data $key) }}
{{- end }}
{{- $_ := set $credentials $name ($value | b64dec) }}
{{- if or (not $existing) (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing) $.Release.Name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- if index .Values "inference-gateway" "enabled" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index .Values "inference-gateway" "auth" "keyRecords" "existingSecret" "name" }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  key-records.json: |
    {"records": [
      {"name": "bootstrap-admin", "sha256": {{ index $credentials .Values.bootstrapAdmin.existingSecret | sha256sum | quote }}, "sandbox": "default", "role": "admin", "scopes": ["inference", "receipts"]}
      {{- if .Values.workflows.enabled }},
      {"name": "workflow-worker", "sha256": {{ index $credentials .Values.workflows.worker.existingSecret | sha256sum | quote }}, "sandbox": "default", "role": "builder", "scopes": ["inference", "receipts", "workflows:execute"]}
      {{- end }}
    ]}
{{- end }}
