# Single-namespace cloud install; deploy/clusters/* retains its separate GitOps defaults.
# Supply provider Secrets in the release namespace, each with an api-key entry.
# v0.7.0 trigger history uses inference-gateway.workflowRecords.runRecordRetentionSeconds;
# usage CSV uses existing monthly Redis accounting. Neither needs an additional service.
providers:
  openai:
    existingSecret: ""
  anthropic:
    existingSecret: ""

# Missing bootstrap Secrets are generated; lookup preserves them on helm upgrade.
bootstrapAdmin:
  existingSecret: agentworkflows-admin

# Isolates the gateway and bundled Redis in this namespace. See the install guide for CIDRs.
networkPolicy:
  enabled: false
  ingressControllerNamespace: ingress-nginx
  # Explicit provider/OIDC/external Redis destination CIDRs and TCP ports; no public egress by default.
  externalEgress: []

workflows:
  enabled: true
  temporal:
    web:
      enabled: false
  postgres:
    enabled: true
    existingSecret: temporal-postgres-auth
  worker:
    team: default
    gatewayUrl: http://inference-gateway:8080
    existingSecret: workflow-gateway-key

inference-gateway:
  enabled: true
  fullnameOverride: inference-gateway
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  antiAffinity:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls:
      enabled: false
      secretName: ""
  redis:
    existingSecret:
      name: ""
      key: url
  storage:
    backend: redis
    postgres:
      existingSecret:
        name: ""
        key: dsn
      bundled:
        enabled: false
  deployment:
    create: false
  workflows:
    temporalAddress: temporal-frontend:7233
  adminConsole:
    enabled: true
    cookieSecure: false
  namespace:
    create: false
  runtime:
    modelId: research
    allowedModels: [research, anthropic]
    ollamaBaseUrl: http://ollama:11434
    vllmBaseUrl: http://vllm:8000
  routing:
    policy:
      enabled: true
      models:
        - id: research
          aliases: [demo-openai]
          backend: openai
          connection:
            baseUrl: https://api.openai.com/v1
            model: gpt-4.1-mini
            credentialEnv: OPENAI_API_KEY
          pricing:
            inputUsdPer1kTokens: 0.0004
            outputUsdPer1kTokens: 0.0016
        - id: anthropic
          backend: anthropic
          connection:
            baseUrl: https://api.anthropic.com/v1
            model: claude-haiku-4-5-20251001
            credentialEnv: ANTHROPIC_API_KEY
          pricing:
            inputUsdPer1kTokens: 0.001
            outputUsdPer1kTokens: 0.005
  sandboxPolicy:
    policy:
      enabled: true
      policies:
        - sandboxId: default
          projects: [default]
          providerCredentials:
            openai: OPENAI_API_KEY
            anthropic: ANTHROPIC_API_KEY
          budgets:
            estimatedTokenLimit: 200000
            costLimitUsd: 50
          tools:
            research:
              url: http://research-tools:8000/research
              costUsd: 0
            publish:
              url: http://research-tools:8000/publish
              costUsd: 0
          workflows:
            ResearchWorkflow:
              allowedProviders: [openai, anthropic]
              allowedModels: [research, anthropic]
              allowedTools: [research, publish]
              allowedEgress: [http://research-tools:8000, https://api.openai.com, https://api.anthropic.com]
              tokenLimit: 10000
              costLimitUsd: 5
              requiredApprovals: 1
              approvalTimeoutSeconds: 604800
  auth:
    enabled: true
    oidc:
      issuer: ""
      clientId: ""
      existingSecret:
        name: ""
        key: oidc-client-secret
      redirectUrl: ""
      scopes: openid profile email
      teamClaim: ""
      roleClaim: role
      projectClaim: project
      defaultRole: viewer
      groupsClaim: groups
      # Maps team IDs to exact company group names and roles; nonempty enables fail-closed group access.
      groupRoleMappings: {}
    keyRecords:
      existingSecret:
        name: agentworkflows-key-records
        key: key-records.json
  receipts:
    enabled: true
  traceability:
    defaultSandboxId: default
    auditChainStore:
      backend: redis
      redisUrl: redis://budget-redis:6379/0
  budget:
    backend: redis
    redisUrl: redis://budget-redis:6379/0
  responseCache:
    redisUrl: redis://budget-redis:6379/1
  serviceMonitor:
    enabled: false
  keda:
    enabled: false
  networkPolicy:
    enabled: false

rag-service:
  enabled: false
  fullnameOverride: rag-service
  namespace:
    create: false
  serviceMonitor:
    enabled: false
  networkPolicy:
    enabled: false

ollama:
  enabled: false
  fullnameOverride: ollama
  namespace:
    create: false
  networkPolicy:
    enabled: false

budget-redis:
  enabled: true
  fullnameOverride: budget-redis
  namespace:
    create: false
  networkPolicy:
    enabled: false

qdrant-vector-store:
  enabled: false
  fullnameOverride: qdrant-vector-store
  namespace:
    create: false
  serviceMonitor:
    enabled: false
  networkPolicy:
    enabled: false

vllm:
  enabled: false
  fullnameOverride: vllm
  namespace:
    create: false
  serviceMonitor:
    enabled: false
  networkPolicy:
    enabled: false
