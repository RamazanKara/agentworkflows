{{- if .Values.worker.workspaces }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-worker
  namespace: {{ .Release.Namespace }}
{{- range .Values.worker.workspaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-worker-{{ .sandbox }}
  namespace: {{ .namespace }}
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    resourceNames: [{{ .sandbox | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [{{ .sandbox | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [{{ .sandbox | quote }}]
    verbs: [get, create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-worker-{{ .sandbox }}
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: workflow-worker
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-worker-{{ .sandbox }}
{{- end }}
{{- end }}
