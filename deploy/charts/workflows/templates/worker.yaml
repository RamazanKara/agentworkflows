apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: workflow-worker
      {{- if .Values.worker.workspaces }}
      serviceAccountName: workflow-worker
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ .Values.worker.image | quote }}
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            timeoutSeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            timeoutSeconds: 2
          startupProbe:
            httpGet: {path: /healthz, port: health}
            failureThreshold: 60
            periodSeconds: 5
          env:
            - name: TEMPORAL_TASK_QUEUE
              value: {{ printf "%s-workflows" .Values.worker.team | quote }}
            - name: AGENTWORKFLOWS_TEAM
              value: {{ .Values.worker.team | quote }}
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: AGENTWORKFLOWS_URL
              value: {{ .Values.worker.gatewayUrl | quote }}
            - name: AGENTWORKFLOWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.existingSecret }}
                  key: api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- if .Values.worker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workflow-worker
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-worker
{{- end }}
