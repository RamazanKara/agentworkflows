apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-worker
    spec:
      {{- if .Values.worker.workspaces }}
      serviceAccountName: workflow-worker
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ .Values.worker.image | quote }}
          env:
            - name: TEMPORAL_TASK_QUEUE
              value: {{ printf "%s-workflows" .Values.worker.team | quote }}
            - name: AGENTWORKFLOWS_TEAM
              value: {{ .Values.worker.team | quote }}
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: AGENTWORKFLOWS_URL
              value: {{ .Values.worker.gatewayUrl | quote }}
            - name: AGENTWORKFLOWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.existingSecret }}
                  key: api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
