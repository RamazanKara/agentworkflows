postgres:
  image: postgres:16-alpine
  existingSecret: temporal-postgres-auth
  storage: 10Gi

worker:
  replicaCount: 1
  terminationGracePeriodSeconds: 210
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  team: demo
  image: ghcr.io/ramazankara/agentworkflows/workflow-worker:v0.4.0
  gatewayUrl: http://inference-gateway.inference.svc.cluster.local:8080
  existingSecret: workflow-gateway-key
  # Existing agent-workspace installations the worker may inspect and execute in.
  workspaces: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

temporal:
  fullnameOverride: temporal
  server:
    image:
      tag: "1.32.0"
    replicaCount: 1
    securityContext: &temporalPodSecurityContext
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    frontend:
      containerSecurityContext: &temporalContainerSecurityContext
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
    internal-frontend:
      containerSecurityContext: *temporalContainerSecurityContext
    history:
      containerSecurityContext: *temporalContainerSecurityContext
    matching:
      containerSecurityContext: *temporalContainerSecurityContext
    worker:
      containerSecurityContext: *temporalContainerSecurityContext
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    config:
      persistence:
        defaultStore: default
        visibilityStore: visibility
        numHistoryShards: 4
        datastores:
          default:
            sql:
              createDatabase: true
              manageSchema: true
              pluginName: postgres12
              databaseName: temporal
              connectAddr: temporal-postgres:5432
              connectProtocol: tcp
              user: temporal
              existingSecret: temporal-postgres-auth
              maxConns: 5
              maxIdleConns: 5
          visibility:
            sql:
              createDatabase: true
              manageSchema: true
              pluginName: postgres12
              databaseName: temporal_visibility
              connectAddr: temporal-postgres:5432
              connectProtocol: tcp
              user: temporal
              existingSecret: temporal-postgres-auth
              maxConns: 5
              maxIdleConns: 5
      namespaces:
        create: true
        useHelmHooks: false
        namespace:
          - name: default
            retention: 30d
  schema:
    # PostgreSQL is part of this release, so schema creation must not run as a pre-install hook.
    useHelmHooks: false
    securityContext: *temporalPodSecurityContext
    containerSecurityContext: *temporalContainerSecurityContext
  admintools:
    enabled: false
    image:
      tag: "1.32.0"
  web:
    securityContext: *temporalPodSecurityContext
    containerSecurityContext: *temporalContainerSecurityContext
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
