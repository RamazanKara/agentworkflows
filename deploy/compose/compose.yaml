# AgentWorkflows: single-host evaluation stack.
#
#   make compose-up      build the images and start the cloud-provider trial
#   make compose-smoke   send governed requests and verify the audit hash chain
#   make compose-down    stop and delete the stack and its volumes
#
# The same service images and environment contract as the Helm charts, without Kubernetes:
# an OpenAI- and Anthropic-compatible gateway in front of local cloud fixtures, with API-key auth bound to
# a sandbox, budgets, prompt-secret blocking, output redaction, agent-action receipts, and a
# hash-chained audit log; plus the RAG service over this repository's docs. Ports bind to
# 127.0.0.1 only. This is an evaluation stack: the cluster profiles add network policy,
# GitOps, Redis-backed state, and the hardened agent workspaces.
#
# Optional chat UI:  docker compose -f deploy/compose/compose.yaml --profile ui up -d
#                    then open http://127.0.0.1:3000

name: agentworkflows

x-gateway-image: &gateway-image agentworkflows/inference-gateway:compose

services:
  ollama:
    profiles: [self-hosted]
    image: ollama/ollama:0.24.0@sha256:a6149234667efc71d37766d61c1a16f24c33e4cd7a0bf4125c44a7e47e2419c4
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: pull the model into the shared volume, then exit. Cached across restarts.
  model-pull:
    profiles: [self-hosted]
    image: ollama/ollama:0.24.0@sha256:a6149234667efc71d37766d61c1a16f24c33e4cd7a0bf4125c44a7e47e2419c4
    entrypoint: ["ollama", "pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  inference-gateway:
    build:
      context: ../../src/inference-gateway
    image: *gateway-image
    ports:
      - "127.0.0.1:${AGENTWORKFLOWS_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./key-records.yaml:/etc/agentworkflows/key-records.yaml:ro
      - ./model-routing.yaml:/etc/agentworkflows/model-routing.yaml:ro
      - ./sandbox-policy.yaml:/etc/agentworkflows/sandbox-policy.yaml:ro
    environment:
      # The legacy runtime backs demo-overload; the routing policy selects cloud adapters.
      TEMPORAL_ADDRESS: temporal:7233
      RUNTIME_BACKEND: vllm
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_ID: ${AGENTWORKFLOWS_MODEL:-demo-openai}
      ALLOWED_MODELS: qwen2.5:0.5b,demo-openai,demo-anthropic,demo-azure-openai,demo-bedrock,demo-vertex,demo-overload
      MODEL_ROUTING_POLICY_PATH: /etc/agentworkflows/model-routing.yaml
      SANDBOX_POLICY_PATH: /etc/agentworkflows/sandbox-policy.yaml
      VLLM_BASE_URL: http://cloud-fake:8000/local-overload
      COMPOSE_PROVIDER_KEY: compose-fake-only
      OPENAI_API_KEY: compose-fake-only
      COMPOSE_WEBHOOK_SECRET: compose-webhook-secret-not-for-production
      COMPOSE_SLACK_WEBHOOK: http://notification-fake:8025/slack
      COMPOSE_OUTGOING_WEBHOOK: http://notification-fake:8025/webhook
      DEFAULT_SANDBOX_ID: demo
      # Every request needs a key. The demo key "local-development-only" is a key record
      # bound to the `demo` sandbox with its own token budget; see key-records.yaml.
      API_KEY_AUTH_ENABLED: "true"
      API_KEY_RECORDS_PATH: /etc/agentworkflows/key-records.yaml
      ALLOW_STREAMING: "true"
      MAX_COMPLETION_TOKENS: "512"
      SANDBOX_BUDGET_ENABLED: "true"
      SANDBOX_BUDGET_BACKEND: redis
      SANDBOX_BUDGET_REDIS_URL: redis://budget-redis:6379/0
      SANDBOX_ESTIMATED_TOKEN_BUDGET: "200000"
      USD_PER_1K_TOKENS: "0.002"
      PROMPT_SECRET_MODE: block
      OUTPUT_GUARDRAIL_ENABLED: "true"
      OUTPUT_GUARDRAIL_MODE: redact
      AGENT_RECEIPTS_ENABLED: "true"
      RESPONSES_STORE_ENABLED: "true"
      # The team console is bundled in this image: http://127.0.0.1:8080/console
      ADMIN_CONSOLE_ENABLED: "true"
      AUDIT_LOG_ENABLED: "true"
      AUDIT_CHAIN_STORE_BACKEND: redis
      AUDIT_CHAIN_STORE_REDIS_URL: redis://budget-redis:6379/0
    depends_on:
      budget-redis:
        condition: service_healthy
      cloud-fake:
        condition: service_started
      temporal:
        condition: service_healthy
    stop_grace_period: 210s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  cloud-fake:
    image: *gateway-image
    pull_policy: never
    command: ["python", "/fixtures/cloud-fake.py"]
    volumes:
      - ./cloud-fake.py:/fixtures/cloud-fake.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  notification-fake:
    image: *gateway-image
    pull_policy: never
    command: ["python", "/fixtures/notification-fake.py"]
    volumes:
      - ./notification-fake.py:/fixtures/notification-fake.py:ro
    ports:
      - "127.0.0.1:${AGENTWORKFLOWS_INBOX_PORT:-8025}:8025"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 128m

  budget-redis:
    image: redis:8.0-alpine@sha256:5f61955be8ab2ccee9372b84ae4d4da2e2b156f87281e3f218544055e7ee04d4
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - workflow-budgets:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 0.5
    mem_limit: 128m

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal-development-only
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 0.5
    mem_limit: 256m

  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: "false"
      DEFAULT_NAMESPACE_RETENTION: 30d
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal-development-only
      POSTGRES_SEEDS: temporal-postgres
      NUM_HISTORY_SHARDS: "4"
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${AGENTWORKFLOWS_TEMPORAL_PORT:-7233}:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 40
    cpus: 1
    mem_limit: 1g

  temporal-ui:
    image: temporalio/ui:2.54.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${AGENTWORKFLOWS_TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m

  workflow-worker:
    build:
      context: ../..
      dockerfile: sdk/python/Dockerfile
    image: agentworkflows/workflow-worker:compose
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      AGENTWORKFLOWS_URL: http://inference-gateway:8080
      AGENTWORKFLOWS_API_KEY: demo-worker
      TEMPORAL_TASK_QUEUE: demo-workflows
      AGENTWORKFLOWS_TEAM: demo
    depends_on:
      temporal:
        condition: service_healthy
      inference-gateway:
        condition: service_healthy
    stop_grace_period: 210s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 24
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 512m

  rag-service:
    build:
      context: ../../src/rag-service
    image: agentworkflows/rag-service:compose
    ports:
      - "127.0.0.1:${AGENTWORKFLOWS_RAG_PORT:-8090}:8080"
    volumes:
      # AgentWorkflows' own documentation is the demo corpus: ask it about the platform.
      - ../../docs:/knowledge:ro
    environment:
      RAG_DOCUMENT_DIR: /knowledge
      DEFAULT_SANDBOX_ID: demo
      # Tenant isolation stays on: a query must name its sandbox (X-Sandbox-ID: demo).
      RAG_RETRIEVAL_TENANT_ISOLATION_ENABLED: "true"
      AUDIT_LOG_ENABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  open-webui:
    profiles: [ui]
    image: ghcr.io/open-webui/open-webui:0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    ports:
      - "127.0.0.1:${AGENTWORKFLOWS_UI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # The UI talks only to the governed gateway, never to Ollama directly.
      OPENAI_API_BASE_URL: http://inference-gateway:8080/v1
      OPENAI_API_KEY: local-development-only
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "false"
      ENABLE_OPENAI_API: "true"
      # No outbound calls: without these, Open WebUI downloads an embedding model from
      # Hugging Face on first start, which a private deployment should not do silently.
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
    depends_on:
      inference-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  temporal-postgres:
  workflow-budgets:
  ollama-models:
  open-webui-data:
