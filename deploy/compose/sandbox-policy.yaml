apiVersion: platform.ai/v1alpha1
kind: SandboxPolicySet
spec:
  policies:
    - sandboxId: demo
      projects: [default, engineering]
      captureContent: redacted
      webhookSecretEnv: COMPOSE_WEBHOOK_SECRET
      notifications:
        consoleUrl: http://127.0.0.1:8080/console/
        slackWebhookEnv: COMPOSE_SLACK_WEBHOOK
        webhookEnv: COMPOSE_OUTGOING_WEBHOOK
        budgetThreshold: 0.8
        smtp:
          host: notification-fake
          port: 1025
          startTls: false
          sender: agentworkflows@example.test
          recipients: [team@example.test]
      providerCredentials:
        openai: OPENAI_API_KEY
        anthropic: COMPOSE_PROVIDER_KEY
        azure-openai: COMPOSE_PROVIDER_KEY
        bedrock: COMPOSE_PROVIDER_KEY
        vertex: COMPOSE_PROVIDER_KEY
      budgets:
        estimatedTokenLimit: 200000
        costLimitUsd: 50
      tools:
        research:
          url: http://cloud-fake:8000/tools/research
          costUsd: 0.01
        publish:
          url: http://cloud-fake:8000/tools/publish
          costUsd: 0.02
        report_source:
          url: http://cloud-fake:8000/tools/report_source
          costUsd: 0.01
        incident_logs:
          url: http://cloud-fake:8000/tools/incident_logs
          costUsd: 0.01
        search_documents:
          url: http://cloud-fake:8000/tools/search_documents
          costUsd: 0.01
      mcpServers:
        team:
          url: http://cloud-fake:8000/mcp
          tools:
            search: 0.01
      workflows:
        DailyReportWorkflow:
          inputSchema:
            type: "object"
            description: "Summarizes the day's agent operations for the team."
            properties:
              topic:
                type: "string"
                description: "What the report covers."
                default: "agent operations"
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedEgress: [http://cloud-fake:8000]
          tokenLimit: 10000
          costLimitUsd: 5
          triggers:
            daily:
              kind: cron
              project: default
              cron: "0 9 * * *"
              input: {topic: Agent operations}
        GitHubIssueTriageWorkflow:
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedEgress: [http://cloud-fake:8000]
          tokenLimit: 10000
          costLimitUsd: 5
          triggers:
            github:
              kind: webhook
              project: engineering
        ResearchWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            description: "Researches a topic, drafts a briefing, and waits for your approval before publishing."
            properties:
              topic:
                type: "string"
                description: "A question or subject, in a sentence."
                examples: ["How should our team evaluate AI agents?"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
              token_limit:
                type: "integer"
                default: 10000
                minimum: 1
                maximum: 1000000000
              cost_limit_usd:
                type: "number"
                default: 5
                exclusiveMinimum: 0
                maximum: 1000000
            required: ["topic"]
            additionalProperties: false
          allowedProviders: [openai, anthropic]
          allowedModels: [demo-openai, demo-anthropic]
          allowedTools: [research, publish]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        SupportTriageWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            description: "Suggests a category, priority and reply draft for a support ticket."
            properties:
              ticket:
                type: "string"
                description: "Paste the customer's message."
                examples: ["I cannot sign in after resetting my password."]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["ticket"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: []
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        CodeReviewWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            description: "Reviews a code change and waits for a human decision."
            properties:
              diff:
                type: "string"
                description: "Paste a unified diff (git diff output)."
                examples: ["- return user.is_admin\n+ return True"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["diff"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: []
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        FrameworkWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            description: "Sends one topic to four agents built with the OpenAI SDK, Anthropic SDK, OpenAI Agents SDK and LangGraph."
            properties:
              topic:
                type: "string"
                description: "A question or subject, in a sentence."
                examples: ["How should our team evaluate AI agents?"]
                minLength: 1
                pattern: "\\S"
            required: ["topic"]
            additionalProperties: false
          allowedProviders: [openai, anthropic]
          allowedModels: [demo-openai, demo-anthropic]
          allowedTools: [team.search]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 4000
          costLimitUsd: 1
        WeeklyReportWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            description: "Combines code changes, support and incidents into one weekly briefing."
            properties:
              period:
                type: "string"
                description: "Start and end date, e.g. 2026-09-28/2026-10-04"
                examples: ["2026-09-28/2026-10-04"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["period"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: [report_source]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        IncidentSummaryWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            description: "Builds an incident timeline grounded in log excerpts."
            properties:
              incident_id:
                type: "string"
                description: "The ID from your incident tracker."
                examples: ["INC-1042"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["incident_id"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: [incident_logs]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        DocumentQAWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            description: "Answers a question from team documents, with checked citations."
            properties:
              question:
                type: "string"
                description: "A question about your team's documents."
                examples: ["Who can approve a workflow, and when does approval expire?"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["question"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: [search_documents]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        ReleaseNotesWorkflow:
          inputSchema: {"type":"object","properties":{"changes":{"type":"string","minLength":1,"pattern":"\\S","description":"Turn merged changes into release notes with a reviewer decision.","examples":["REL-42: Added CSV usage export. Fixed approval expiry. Removed the legacy /draft endpoint."]},"model":{"type":"string","default":"demo-openai","minLength":1,"pattern":"\\S"}},"required":["changes"],"additionalProperties":false}
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: []
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
          approvalRequired: true
          requiredApprovals: 1
          approvalTimeoutSeconds: 604800
        MeetingActionsWorkflow:
          inputSchema: {"type":"object","properties":{"transcript":{"type":"string","minLength":1,"pattern":"\\S","description":"Extract decisions, owners, and due dates from a meeting transcript.","examples":["09:00 Maya: We will pilot the review workflow. 09:02 Leo: I own the rollout checklist, due Friday. 09:04 Maya: Budget approval is still open."]},"model":{"type":"string","default":"demo-openai","minLength":1,"pattern":"\\S"}},"required":["transcript"],"additionalProperties":false}
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: []
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
          approvalRequired: true
          requiredApprovals: 1
          approvalTimeoutSeconds: 604800
        SecurityQuestionnaireWorkflow:
          inputSchema: {"type":"object","properties":{"evidence":{"type":"string","minLength":1,"pattern":"\\S","description":"Draft evidence-backed questionnaire answers and flag unsupported claims.","examples":["Q1: Are approvals required? E1: The team policy requires two reviewers before publication. Q2: Is SOC 2 certification current? No certification evidence supplied."]},"model":{"type":"string","default":"demo-openai","minLength":1,"pattern":"\\S"}},"required":["evidence"],"additionalProperties":false}
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: []
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
          approvalRequired: true
          requiredApprovals: 1
          approvalTimeoutSeconds: 604800
    - sandboxId: other
      projects: [default]
      budgets:
        estimatedTokenLimit: 1000
        costLimitUsd: 1
