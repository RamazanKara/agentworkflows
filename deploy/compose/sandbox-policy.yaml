apiVersion: platform.ai/v1alpha1
kind: SandboxPolicySet
spec:
  policies:
    - sandboxId: demo
      tools:
        research:
          url: http://cloud-fake:8000/tools/research
          costUsd: 0.01
        publish:
          url: http://cloud-fake:8000/tools/publish
          costUsd: 0.02
      mcpServers:
        team:
          url: http://cloud-fake:8000/mcp
          tools:
            search: 0.01
      workflows:
        ResearchWorkflow:
          allowedProviders: [openai, anthropic]
          allowedModels: [demo-openai, demo-anthropic]
          allowedTools: [research, publish]
          allowedEgress: [http://cloud-fake:8000]
          tokenLimit: 10000
          costLimitUsd: 5
        FrameworkWorkflow:
          allowedProviders: [openai, anthropic]
          allowedModels: [demo-openai, demo-anthropic]
          allowedTools: [team.search]
          allowedEgress: [http://cloud-fake:8000]
          tokenLimit: 4000
          costLimitUsd: 1
