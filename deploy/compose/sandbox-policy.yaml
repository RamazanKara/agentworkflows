apiVersion: platform.ai/v1alpha1
kind: SandboxPolicySet
spec:
  policies:
    - sandboxId: demo
      projects: [default, engineering]
      captureContent: redacted
      webhookSecretEnv: COMPOSE_WEBHOOK_SECRET
      notifications:
        consoleUrl: http://127.0.0.1:8080/console/
        slackWebhookEnv: COMPOSE_SLACK_WEBHOOK
        webhookEnv: COMPOSE_OUTGOING_WEBHOOK
        budgetThreshold: 0.8
        smtp:
          host: notification-fake
          port: 1025
          startTls: false
          sender: agentworkflows@example.test
          recipients: [team@example.test]
      providerCredentials:
        openai: OPENAI_API_KEY
        anthropic: COMPOSE_PROVIDER_KEY
        azure-openai: COMPOSE_PROVIDER_KEY
        bedrock: COMPOSE_PROVIDER_KEY
        vertex: COMPOSE_PROVIDER_KEY
      budgets:
        estimatedTokenLimit: 200000
        costLimitUsd: 50
      tools:
        research:
          url: http://cloud-fake:8000/tools/research
          costUsd: 0.01
        publish:
          url: http://cloud-fake:8000/tools/publish
          costUsd: 0.02
        report_source:
          url: http://cloud-fake:8000/tools/report_source
          costUsd: 0.01
        incident_logs:
          url: http://cloud-fake:8000/tools/incident_logs
          costUsd: 0.01
        search_documents:
          url: http://cloud-fake:8000/tools/search_documents
          costUsd: 0.01
      mcpServers:
        team:
          url: http://cloud-fake:8000/mcp
          tools:
            search: 0.01
      workflows:
        DailyReportWorkflow:
          inputSchema:
            type: "object"
            properties:
              topic:
                type: "string"
                description: "Daily report topic"
                default: "agent operations"
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedEgress: [http://cloud-fake:8000]
          tokenLimit: 10000
          costLimitUsd: 5
          triggers:
            daily:
              kind: cron
              project: default
              cron: "0 9 * * *"
              input: {topic: Agent operations}
        GitHubIssueTriageWorkflow:
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedEgress: [http://cloud-fake:8000]
          tokenLimit: 10000
          costLimitUsd: 5
          triggers:
            github:
              kind: webhook
              project: engineering
        ResearchWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              topic:
                type: "string"
                description: "Research topic"
                examples: ["How should our team evaluate AI agents?"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                description: "Approved model ID"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
              token_limit:
                type: "integer"
                description: "Run token budget"
                default: 10000
                minimum: 1
                maximum: 1000000000
              cost_limit_usd:
                type: "number"
                description: "Run cost budget in USD"
                default: 5
                exclusiveMinimum: 0
                maximum: 1000000
            required: ["topic"]
            additionalProperties: false
          allowedProviders: [openai, anthropic]
          allowedModels: [demo-openai, demo-anthropic]
          allowedTools: [research, publish]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        SupportTriageWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              ticket:
                type: "string"
                description: "Support ticket text"
                examples: ["I cannot sign in after resetting my password."]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                description: "Approved model ID"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["ticket"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: []
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        CodeReviewWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              diff:
                type: "string"
                description: "Pull request diff"
                examples: ["- return user.is_admin\n+ return True"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                description: "Approved model ID"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["diff"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: []
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        FrameworkWorkflow:
          allowedProviders: [openai, anthropic]
          allowedModels: [demo-openai, demo-anthropic]
          allowedTools: [team.search]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 4000
          costLimitUsd: 1
        WeeklyReportWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              period:
                type: "string"
                description: "Reporting period"
                examples: ["2026-09-28/2026-10-04"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                description: "Approved model ID"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["period"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: [report_source]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        IncidentSummaryWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              incident_id:
                type: "string"
                description: "Incident identifier"
                examples: ["INC-1042"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                description: "Approved model ID"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["incident_id"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: [incident_logs]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
        DocumentQAWorkflow:
          inputSchema:
            $schema: "https://json-schema.org/draft/2020-12/schema"
            type: "object"
            properties:
              question:
                type: "string"
                description: "Question about the team documents"
                examples: ["Who can approve a workflow, and when does approval expire?"]
                minLength: 1
                pattern: "\\S"
              model:
                type: "string"
                description: "Approved model ID"
                default: "demo-openai"
                minLength: 1
                pattern: "\\S"
            required: ["question"]
            additionalProperties: false
          allowedProviders: [openai]
          allowedModels: [demo-openai]
          allowedTools: [search_documents]
          allowedEgress: [http://cloud-fake:8000, https://api.openai.com]
          tokenLimit: 10000
          costLimitUsd: 5
    - sandboxId: other
      projects: [default]
      budgets:
        estimatedTokenLimit: 1000
        costLimitUsd: 1
