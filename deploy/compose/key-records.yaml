# API-key records for the Compose evaluation stack (API_KEY_RECORDS_PATH).
#
# The gateway stores only SHA-256 digests. This one is the digest of the published demo key
# "local-development-only"; it authenticates nothing outside this stack. To add a key:
#   printf '%s' "$KEY" | sha256sum
records:
  - name: demo-key
    sha256: ed20191044553dac8f9c45e62062dd18e7dc1f898a897240b4179fb84fea3db4
    # Bound: requests run as sandbox `demo` whatever X-Sandbox-ID says, and naming another
    # sandbox is rejected. Binding is also what unlocks the Responses store and Files API.
    sandbox: demo
    role: admin
    scopes: [inference, receipts]
    budget:
      estimatedTokenLimit: 200000
  - name: demo-builder
    sha256: d501daf4337d11182e2a9bd63bb1c00ef0d4d8a59803cb53b8e3c4155f197ed7
    sandbox: demo
    role: builder
    scopes: [inference, receipts]
  - name: demo-approver
    sha256: 62e09a13d5dff5e69890e2d16f3a5d6f2d113a7369d08a6e62eabde7cc26eda6
    sandbox: demo
    role: approver
    scopes: [inference, receipts]
  - name: demo-viewer
    sha256: 2c409f0dcce66d0c980ae534d1ccdc0fc6738d7fc35d803949919f4dfa3f8834
    sandbox: demo
    role: viewer
    scopes: [inference, receipts]
  - name: demo-worker
    sha256: d98451ef87c1e0d24105824b1c67ec975f9d91a2a219ec36218728f292f059c1
    sandbox: demo
    role: builder
    scopes: [inference, receipts, workflows:execute]
  - name: demo-other-team
    sha256: be66ec7a0e973fce335f1b593779f19ba3bcab67780d6bc617849858b4c56b5f
    sandbox: other
    role: viewer
    scopes: [inference, receipts]
