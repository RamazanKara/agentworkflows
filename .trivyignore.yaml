# Reviewed Trivy findings, scoped to the exact file and rule rather than disabled globally.
# An entry here is an accepted finding with a reason, not a way to make the scan quiet:
# anything without a justification that survives review does not belong in this file.

misconfigurations:
  - id: KSV-0109
    paths:
      - "platform/model-catalog/k8s/configmap.yaml"
    statement: >-
      False positive from a substring match. KSV-0109 flags ConfigMap keys that look like
      secrets, and it matches "Token" inside estimatedCharsPerToken, the reviewed
      characters-per-token divisor used to estimate a request's token cost for budgeting.
      The value is a small integer (3 or 4), the catalog holds no credentials, and every
      real secret in AgentWorkflows is a Kubernetes Secret or an External Secrets reference. The
      field is named for the domain term; renaming it to evade the heuristic would trade a
      correct name for a quiet scanner.
  - id: KSV-0109
    paths:
      - "deploy/charts/workflows/charts/temporal/templates/server-configmap.yaml"
    statement: >-
      False positive in the Temporal 1.7.0 chart's config_template.yaml. The password
      fields contain only runtime template expressions referencing
      TEMPORAL_DEFAULT_STORE_PASSWORD and TEMPORAL_VISIBILITY_STORE_PASSWORD, not
      credentials. Both environment variables use secretKeyRef to read the password
      from temporal-postgres-auth, configured through each datastore's existingSecret
      in deploy/charts/workflows/values.yaml. The server expands these expressions
      in memory; no password is stored in the ConfigMap.
