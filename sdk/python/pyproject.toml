[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentworkflows"
version = "0.5.1"
description = "Python SDK for governed model calls and durable Temporal workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AgentWorkflows maintainers" }]
keywords = ["llm", "gateway", "openai-compatible", "anthropic", "agents", "workflows", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "temporalio>=1.34,<2"]

[project.optional-dependencies]
frameworks = ["openai-agents==0.23.1", "anthropic==1.11.0", "langgraph==1.2.14"]

[project.scripts]
agentworkflows = "agentworkflows.cli:main"

[project.urls]
Homepage = "https://github.com/RamazanKara/agentworkflows"
Documentation = "https://ramazankara.github.io/agentworkflows/"
Source = "https://github.com/RamazanKara/agentworkflows"
Changelog = "https://github.com/RamazanKara/agentworkflows/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# One package; py.typed marks the inline annotations for type checkers (PEP 561).
packages = ["agentworkflows"]

[tool.hatch.build.targets.sdist]
include = ["agentworkflows", "tests", "README.md"]
