version: 2
# Dependabot edits the requirement inputs (*.txt / *.in) but cannot regenerate the
# hash-pinned locks. Run `make relock` and `make dependency-lock-check` locally
# and commit the updated locks to the Dependabot branch before merging.
updates:
  # GitHub Actions: keeps SHA-pinned `uses:` refs current via the trailing
  # version comment on each pin.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, github_actions]
    groups:
      actions:
        patterns: ["*"]

  # Repository tooling: quality, docs, and SDK build/test locks.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies, python]
    groups:
      tooling:
        patterns: ["*"]

  # Both services pin identical runtime versions; one grouped PR keeps them in step.
  - package-ecosystem: pip
    directories:
      - "/src/inference-gateway"
      - "/src/rag-service"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    labels: [dependencies, python]
    groups:
      services:
        patterns: ["*"]

  # Base-image digests for the service and worker Dockerfiles. Python and Node.js minor and
  # major moves are deliberate toolchain changes (CI, the production checks and the console
  # build pin the same versions), so only digest and patch updates come from here.
  - package-ecosystem: docker
    directories:
      - "/src/inference-gateway"
      - "/src/rag-service"
      - "/sdk/python"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    labels: [dependencies, docker]
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      base-images:
        patterns: ["*"]
