# Runs only for version tags: builds, signs and publishes one release.
# Images are built from the tagged commit; charts embed those image digests.
name: AgentWorkflows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          # The changelog section for this tag, without its heading.
          awk -v tag="## ${GITHUB_REF_NAME} " 'index($0, tag) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
          { printf 'Docs: https://ramazankara.github.io/agentworkflows/\n'; cat notes.md; } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "AgentWorkflows ${GITHUB_REF_NAME}" --notes-file release-notes.md

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-sdk-build.lock
            requirements-sdk-test.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: pip install --require-hashes -r requirements-sdk-build.lock -r requirements-sdk-test.lock
      - name: Check SDK versions match the tag
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          python_version="$(python -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml", "rb"))["project"]["version"])')"
          ts_version="$(node -p 'require("./sdk/typescript/package.json").version')"
          [[ "$python_version" == "$expected" ]] || { echo "Python SDK is $python_version, tag is $expected"; exit 1; }
          [[ "$ts_version" == "$expected" ]] || { echo "TypeScript SDK is $ts_version, tag is $expected"; exit 1; }
      - name: Build and smoke-test the Python wheel and source archive
        run: |
          set -euo pipefail
          python -m build --no-isolation --outdir sdk-dist sdk/python
          python -m pip install --no-deps --target /tmp/sdk-smoke sdk-dist/*.whl
          PYTHONPATH=/tmp/sdk-smoke python -c 'from agentworkflows import GatewayClient; print(GatewayClient.__name__)'
      - name: Pack the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm pack --pack-destination ../../sdk-dist
      - name: Attach SDK files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd sdk-dist && sha256sum ./*) > sdk-checksums.txt
          gh release upload "$GITHUB_REF_NAME" sdk-dist/* sdk-checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize image repository
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push gateway image
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: src/inference-gateway
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}/inference-gateway:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}/inference-gateway:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
      - name: Build and push RAG service image
        id: rag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: src/rag-service
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}/rag-service:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}/rag-service:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
      - name: Build and push workflow worker image
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: sdk/python/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}/workflow-worker:${{ github.ref_name }}
            ${{ env.IMAGE_REPO }}/workflow-worker:${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign image digests
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REPO}/inference-gateway@${{ steps.gateway.outputs.digest }}"
          cosign sign --yes "${IMAGE_REPO}/rag-service@${{ steps.rag.outputs.digest }}"
          cosign sign --yes "${IMAGE_REPO}/workflow-worker@${{ steps.worker.outputs.digest }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4  # v2.0.2
        with:
          # setup-oras v2.0.0's signed release catalog supports ORAS CLI up to 1.3.1.
          version: 1.3.1
      - name: Package, push and sign digest-bound Helm charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install pyyaml==6.0.3
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          scripts/package-release-charts.py \
            --version "${GITHUB_REF_NAME#v}" \
            --gateway-digest "${{ steps.gateway.outputs.digest }}" \
            --rag-digest "${{ steps.rag.outputs.digest }}" \
            --worker-digest "${{ steps.worker.outputs.digest }}" \
            --source-revision "${GITHUB_SHA}" \
            --output-dir chart-packages
          for package in chart-packages/*.tgz; do
            push_out="$(helm push "$package" "oci://${IMAGE_REPO}/charts" 2>&1)"
            echo "${push_out}"
            ref="$(printf '%s\n' "${push_out}" | awk '/^Pushed:/ {print $2}')"
            digest="$(printf '%s\n' "${push_out}" | awk '/^Digest:/ {print $2}')"
            [[ -n "${ref}" && -n "${digest}" ]]
            cosign sign --yes "${ref%:*}@${digest}"
          done
          # Artifact Hub reads repository metadata from this special tag.
          oras push "${IMAGE_REPO}/charts/agentworkflows:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
          cosign sign-blob --yes \
            --bundle chart-packages/chart-release-manifest.sigstore.json \
            chart-packages/chart-release-manifest.json
          gh release upload "$GITHUB_REF_NAME" chart-packages/*.tgz \
            chart-packages/chart-release-manifest.json chart-packages/chart-release-manifest.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    # Enable only after registering the trusted publisher described in docs/distribution.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sdk
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/agentworkflows
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the released Python files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'agentworkflows-*' --dir sdk-dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: sdk-dist
