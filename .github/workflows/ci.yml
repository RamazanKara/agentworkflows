# One job on pushes to main and manual runs: lint, unit tests and builds.
# Local-only: make static-checks, make test-console, make validate-full, make compose-smoke,
# image builds and the Trivy scan (see CONTRIBUTING.md).
name: AgentWorkflows CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAYON_NUM_THREADS: "2"

jobs:
  ci:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: python
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            src/inference-gateway/console/package-lock.json
            sdk/typescript/package-lock.json
      # Keyed on the exact Python version and the hashed locks, so a run without lock
      # changes skips every pip install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .venv-quality
            src/inference-gateway/.venv
            src/rag-service/.venv
          key: ci-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-quality.lock', 'src/inference-gateway/requirements-dev.lock', 'src/rag-service/requirements-dev.lock', 'requirements-sdk-test.lock') }}
      - name: Lint, format, types and release version references
        run: make lint format-check typecheck release-check
      - name: Repository tooling tests
        run: make test-scripts
      - name: Gateway, Python SDK and RAG tests with the console build
        run: make -j2 test-gateway test-rag
      - name: TypeScript SDK build, lint, tests and package check
        run: make test-typescript
      - name: SDK import check
        env:
          PYTHONPATH: sdk/python
        run: src/inference-gateway/.venv/bin/python -c 'from agentworkflows import GatewayClient; print(GatewayClient.__name__)'
