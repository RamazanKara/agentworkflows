# Local-only: make validate-full, make compose-smoke, image builds and security scripts (see CONTRIBUTING.md).
name: AgentWorkflows CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-quality.lock
            requirements-sdk-test.lock
            src/inference-gateway/requirements-dev.lock
            src/rag-service/requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/inference-gateway/console/package-lock.json
      - name: Lint
        run: make -j2 lint
      - name: Unit tests and console build
        run: make -j2 test-scripts test-gateway test-rag
      - name: SDK import check
        env:
          PYTHONPATH: sdk/python
        run: src/inference-gateway/.venv/bin/python -c 'from agentworkflows import GatewayClient; print(GatewayClient.__name__)'
